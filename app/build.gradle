
plugins {
    alias libs.plugins.android.application
    alias libs.plugins.jetbrains.kotlin.android
    alias libs.plugins.navigation.safeargs
    alias libs.plugins.realm.kotlin
    alias libs.plugins.hilt
    alias libs.plugins.google.services
    alias libs.plugins.kotlin.compose
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
}

android {
    namespace 'com.tkw.omamul'
    compileSdk 34

    defaultConfig {
        applicationId "com.tkw.omamul"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions = ["app-dev"]
    productFlavors {
        prod {
            dimension "app-dev"
        }

        dev {
            dimension "app-dev"
            applicationIdSuffix '.dev'
            versionNameSuffix "-dev"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        dev {
            res.srcDirs = ['src/dev/res']
        }
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/INDEX.LIST'
    }
}

dependencies {
    implementation project(':core:data')
    implementation project(':core:domain')
    implementation project(':core:common')
    implementation project(':core:alarmnoti')
    implementation project(':core:firebase')

    implementation project(':feature-common:base')
    implementation project(':feature-common:init')
    implementation project(':feature-water:alarm')
    implementation project(':feature-water:cup')
    implementation project(':feature-water:home')
    implementation project(':feature-water:record')
    implementation project(':feature-water:setting')

    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.android.material
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso

    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.splash

    //by viewModels
    implementation libs.androidx.activity.ktx

    //by activityViewModels
    implementation libs.androidx.fragment.ktx

    //retrofit
    implementation libs.bundles.retrofit

    //hilt
    implementation libs.hilt
    // KAPT(Kotlin Annotation Processing Tools), 어노테이션 사용, annotationProcessor의 대체
    kapt libs.hilt.compiler

    implementation libs.androidx.work.runtime.ktx

    //AuthorizationClient
    implementation libs.play.services.auth

    // compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.bundles.compose
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}

kapt {
    correctErrorTypes true
}
